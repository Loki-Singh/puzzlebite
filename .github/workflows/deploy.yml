name: Deploy React + Vite to S3

# Trigger on push to main or manual run
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build project
      - name: Build project
        run: npm run build

      # Step 5: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 6: Clean S3 bucket (delete old files)
      - name: Clean S3 bucket
        run: aws s3 rm s3://puzzlebite-frontend-on-s3 --recursive

      # Step 7: Deploy to S3
      - name: Deploy to S3
        run: |
          # Sync all assets except index.html (long-term cache)
          aws s3 sync ./dist s3://puzzlebite-frontend-on-s3 \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

          # Upload index.html separately (no cache)
          aws s3 cp ./dist/index.html s3://puzzlebite-frontend-on-s3/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
